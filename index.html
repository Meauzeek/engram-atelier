<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="description" content="图录工坊：本地 CYOA 创作、试玩与图件导出。手机版 / 平板版 · v5.">
<meta name="theme-color" content="#F1F0ED"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="图录工坊"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>随星录 · 图录工坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 0h56v56l-8 8H0V8z' fill='%238a2be2'/%3E%3Cpath d='M15 17h34v7H22v6h21v7H22v6h27v7H15z' fill='%23f0f0f0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css" data-app-style>
</head>
<body>
<div class="bg-system" aria-hidden="true"><div class="bg-lines"><i></i><i></i><i></i></div><div class="bg-grid"></div><div class="bg-cluster"></div></div>
<div id="app" data-ui-theme="light">
  <header class="topbar">
    <button class="brand" data-action="cover" title="项目总览"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span>图录工坊<small>ENGRAM ATELIER</small></span></button>
    <div class="top-project"><strong id="projectName">随星录</strong><small id="saveState" role="status">正在读取项目…</small></div>
    <nav class="mode-switch" aria-label="工作模式"><button data-action="mode" data-value="edit" class="active">编辑 <span>EDIT</span></button><button data-action="mode" data-value="play">试玩 <span>PLAY</span></button></nav>
    <div class="top-actions"><div class="history-actions"><button class="icon-btn" data-action="undo" title="撤销（Ctrl/Cmd+Z）" aria-label="撤销">↶</button><button class="icon-btn" data-action="redo" title="重做（Ctrl/Cmd+Shift+Z）" aria-label="重做">↷</button></div><button class="btn" data-action="library">项目库</button><button class="btn" data-action="import">导入</button><button class="btn" data-action="save-as" title="另存为（Ctrl/Cmd + Shift + S）">另存为</button><button class="btn" data-action="sync">存档 / MD</button><button class="btn primary export-main" data-action="export">导出图件 <span>↗</span></button></div><button class="icon-btn mobile-menu-button" data-action="mobile-menu" aria-label="更多操作">⋯</button>
  </header>
  <nav class="filterbar" aria-label="模块筛选">
    <span class="filter-label">MODULE FILTER</span><div class="filter-options"><button data-action="filter" data-value="all" class="active">全部</button><button data-action="filter" data-value="choices" class="type-choices">选项</button><button data-action="filter" data-value="attributes" class="type-attributes">素质</button><button data-action="filter" data-value="scenario" class="type-scenario">路线</button><button data-action="filter" data-value="text" class="type-text">文本</button></div><span id="viewCount">0 MODULES / 0 OPTIONS</span>
  </nav>
  <div class="workspace">
    <aside class="left-panel" aria-label="项目结构">
      <div class="panel-label"><strong>项目目录</strong><button class="icon-btn" data-action="project" aria-label="项目设置" title="开场、代币与外观设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg></button></div>
      <div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="搜索模块或选项" aria-label="查找模块或卡片"></div>
      <button class="outline-cover" data-action="cover"><span class="cover-icon">◈</span><span>项目总览<small>OVERVIEW / OPENING</small></span><span>↗</span></button>
      <div id="moduleTree" class="module-tree"></div>
      <div class="outline-actions"><button class="btn wide add-module-btn" data-action="add-module">＋ 添加模块</button><button class="text-btn" data-action="new">新建 / 切换模板</button></div>
      <div class="left-bottom"><div class="token-block"><div><span id="tokenCaption">初始资源</span><small id="tokenName">待命名</small></div><strong id="tokenValue">0</strong></div><div id="progressStats"></div><div class="sidebar-foot"><button class="text-btn" data-action="new">新建</button><button class="text-btn" data-action="help">使用说明 ↗</button><span class="version">V5.0 / LOCAL FIRST</span></div></div>
    </aside>
    <main class="stage">
      <div class="stage-toolbar"><div class="stage-title"><button class="icon-btn outline-toggle" data-action="toggle-outline" title="打开目录" aria-label="打开目录">☰</button><span class="signal-dot"></span><span id="stageMode">编辑画布</span><span class="muted" id="stageHint">点击卡片编辑</span></div><div class="stage-tools"><div class="scope-switch"><button data-action="canvas-scope" data-value="module" class="active">单模块</button><button data-action="canvas-scope" data-value="all">完整文档</button></div><button class="text-btn" data-action="toggle-placeholders" id="placeholderBtn">隐藏图位</button><button class="icon-btn" data-action="theme" id="themeBtn" title="切换深色" aria-label="切换深色"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button><button class="icon-btn inspector-toggle" data-action="toggle-inspector" aria-label="打开编辑面板" aria-expanded="false" title="编辑面板"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M14 4v16M17 9h1M17 12h1M17 15h1"/></svg></button></div></div>
      <div id="stageScroll" class="stage-scroll"><div id="playLedger" class="play-ledger"></div><div id="paperWrap"><div id="paper"></div></div><div id="stageEnd" class="stage-end"><span>END OF RECORD</span><div></div><button class="text-btn" data-action="add-module">＋ 添加模块</button></div></div>
    </main>
    <aside class="inspector" aria-label="属性编辑" aria-hidden="true" inert><div class="inspector-top"><div><span class="mono" id="inspectorType">PROJECT</span><strong id="inspectorTitle">项目设置</strong></div><button class="icon-btn" data-action="close-inspector" aria-label="收起编辑面板" title="收起（Esc）">×</button></div><div id="inspectorBody" class="inspector-body"></div><div class="inspector-save"><span><i></i>修改实时保存</span><button class="btn primary" data-action="close-inspector">完成编辑 ✓</button></div></aside>
  </div>
</div>
<button id="panelBackdrop" class="panel-backdrop" data-action="close-panels" aria-label="关闭侧栏" hidden></button>
<nav class="mobile-dock" aria-label="常用操作"><button data-action="toggle-outline"><span aria-hidden="true">☰</span>目录</button><button data-action="toggle-inspector"><span aria-hidden="true">✎</span>编辑</button><button data-action="mobile-mode" id="mobilePlayButton"><span aria-hidden="true">▷</span>试玩</button><button data-action="library"><span aria-hidden="true">▣</span>存档</button></nav>
<div id="offlineNotice" role="status" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div class="modal-head"><div><span class="mono" id="modalEyebrow">ENGRAM ATELIER</span><h2 id="modalTitle"></h2></div><button class="icon-btn" data-action="close-modal" aria-label="关闭对话框">×</button></div><div id="modalBody"></div></dialog>
<input type="file" id="importInput" accept=".json,.js,.zip" hidden>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input type="file" id="fontInput" accept=".woff2,.woff,.ttf,.otf" multiple hidden>
<input type="file" id="cnFontInput" accept=".woff2,.woff,.ttf,.otf" multiple hidden>
<div id="exportMount" aria-hidden="true"></div>
<script src="vendor/jszip.min.js" data-app-script></script>
<script src="fonts.js" data-app-script></script>
<script src="core.js" data-app-script></script>
<script src="examples.js" data-app-script></script>
<script src="seeds.js" data-app-script></script>
<script src="brand.js" data-app-script></script>
<script src="view.js" data-app-script></script>
<script src="exports.js" data-app-script></script>
<script src="storage.js" data-app-script></script>
<script src="app.js" data-app-script></script>
<script src="pwa.js" data-app-script></script>
</body></html>
